[project]
name = "owl-akrida"
version = "1.0.0"
description = "Load testing tool for Aries agents"
requires-python = ">=3.10"
dependencies = [
    "locust==2.42.2",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]
integration = [
    "aiohttp>=3.9.0",
]
all = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "aiohttp>=3.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
lint.select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]
"load-agent/locust-files/*" = ["N999"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Monkey-patching ssl:",
]
markers = [
    "integration: marks tests as integration tests requiring Docker",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
